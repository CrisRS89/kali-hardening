#!/usr/sbin/nft -f

flush ruleset

# ============================================================
# Kali Linux Hardening - nftables.conf
# ENFOQUE: LISTA BLANCA - Solo dispositivos autorizados
# ============================================================

table inet filter {
  # ============================================================
  # LISTA BLANCA DE DISPOSITIVOS AUTORIZADOS
  # Solo estos MACs pueden acceder a la red
  # ============================================================
  set whitelist_macs { type ether_addr \; flags interval \; }
  set whitelist_ips { type ipv4_addr \; flags interval \; }
  
  # Bloqueo dinámico temporal
  set blocked_macs { type ether_addr \; flags dynamic,timeout \; }
  set blocked_ips { type ipv4_addr \; flags dynamic,timeout \; }
  
  # Tracking de dispositivos para detección de anomalías
  set tracked_macs { type ether_addr \; flags dynamic,timeout 3600 \; }

  chain input {
    type filter hook input priority filter; policy drop;

    # Loopback siempre permitido
    iif lo accept
    iif != lo ip daddr 127.0.0.0/8 drop
    iif != lo ip6 daddr ::1/128 drop

    # Estado de conexiones existentes
    ct state established,related accept
    ct state invalid drop

    # ============================================================
    # LISTA BLANCA - Solo MACs autorizados pasan
    # ============================================================
    
    # Bloquear MACs conocidos como maliciosos primero
    iif eth0 ether saddr @blocked_macs log prefix "[NFT-BLOCKED-MAC] " drop
    
    # Rechazar MACs que no están en la whitelist
    iif eth0 ether saddr != @whitelist_macs log prefix "[NFT-UNKNOWN-MAC] " drop

    # ============================================================
    # TRÁFICO PERMITIDO SOLO PARA DISPOSITIVOS EN LISTA BLANCA
    # ============================================================
    
    # ICMP con rate limit (solo para whitelist)
    ip protocol icmp icmp type echo-request limit rate 5/second accept
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept

    # SSH con rate limit extremo (solo IPs conocidas)
    tcp dport ssh meter ssh-meter { ip saddr limit rate 5/minute } accept

    # DHCP - Solo permitir respuestas del servidor legítimo
    udp dport 67 udp sport 68 ct state new limit rate 1/minute accept
    
    # ARP con rate limit agresivo
    arp limit rate 5/second accept
    arp log prefix "[NFT-ARP-VIOLATION] " drop

    # Log y drop todo lo no autorizado
    log prefix "[NFT-DROP-UNAUTHORIZED] " flags all counter drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    
    # Solo forward para IPs en whitelist
    ip saddr @whitelist_ips ip daddr @whitelist_ips accept
    log prefix "[NFT-BLOCK-FWD] " counter drop
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}

# ============================================================
# TABLA RAW - Anti-spoofing agresivo
# ============================================================
table inet raw {
  chain prerouting {
    type filter hook prerouting priority raw; policy accept;
    
    # Anti-spoofing completo
    iif eth0 ip saddr 127.0.0.0/8 drop
    iif eth0 ip saddr 10.0.0.0/8 drop
    iif eth0 ip saddr 172.16.0.0/12 drop
    iif eth0 ip saddr 192.168.0.0/16 drop
    iif eth0 ip saddr 169.254.0.0/16 drop
    iif eth0 ip saddr 0.0.0.0/8 drop
    iif eth0 ip saddr 224.0.0.0/4 drop
    iif eth0 ip saddr 240.0.0.0/4 drop
    iif eth0 ip saddr 255.255.255.255/32 drop
    
    # ARP flood protection extremo
    arp type { request, reply } limit rate 10/second accept
    arp type { request, reply } log prefix "[NFT-ARP-FLOOD] " drop
    
    # Tracking de MACs para fingerprinting
    ether saddr != @whitelist_macs ether saddr add @tracked_macs
  }
}

# ============================================================
# TABLA DE BLOQUEO DINÁMICO - Para respuesta automática
# ============================================================
table inet dynamic_block {
  set auto_blocked_macs { type ether_addr \; flags dynamic,timeout 3600 \; }
  set auto_blocked_ips { type ipv4_addr \; flags dynamic,timeout 3600 \; }
  
  chain prerouting {
    type filter hook prerouting priority -10; policy accept;
    ether saddr @auto_blocked_macs log prefix "[NFT-AUTO-BLOCK] " drop
    ip saddr @auto_blocked_ips drop
  }
}

# ============================================================
# TABLA DE RATE LIMITING - Protección contra abuso
# ============================================================
table inet ratelimit {
  set ssh_attempts { type ipv4_addr \; flags dynamic,timeout 600 \; }
  set dhcp_requests { type ipv4_addr \; flags dynamic,timeout 60 \; }
  
  chain input {
    type filter hook input priority 10; policy accept;
    
    # Bloquear IPs con muchos intentos SSH
    meter ssh_rate { ip saddr limit rate 3/minute } accept
    tcp dport ssh add @ssh_attempts { ip saddr } drop
    
    # Bloquear DHCP flood
    udp dport 67 meter dhcp_rate { ip saddr limit rate 1/minute } accept
    udp dport 67 add @dhcp_requests { ip saddr } drop
  }
}
